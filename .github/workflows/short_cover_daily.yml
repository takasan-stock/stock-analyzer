name: Short Cover Daily

on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-short-cover:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Short Cover daily scan
        run: python scripts/short_cover_daily.py

      - name: Commit updated Short Cover data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/short_cover_alert_history.csv data/short_cover_daily_status.json
          if git diff --cached --quiet; then
            echo "No Short Cover data changes"
            exit 0
          fi
          git commit -m "Update Short Cover daily data"
          git push
