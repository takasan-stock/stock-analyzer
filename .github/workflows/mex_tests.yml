name: MEX Tests

on:
  pull_request:
    paths:
      - "multiple_expansion.py"
      - "jquants_mex_adapter.py"
      - "scripts/build_mex_jquants.py"
      - "pages/14_Multiple_Expansion_Hunter.py"
      - "tests/test_multiple_expansion.py"
      - "tests/test_jquants_mex_adapter.py"
      - ".github/workflows/mex_tests.yml"
  push:
    branches:
      - "codex/multiple-expansion-hunter-v0-1"
    paths:
      - "multiple_expansion.py"
      - "jquants_mex_adapter.py"
      - "scripts/build_mex_jquants.py"
      - "pages/14_Multiple_Expansion_Hunter.py"
      - "tests/test_multiple_expansion.py"
      - "tests/test_jquants_mex_adapter.py"
      - ".github/workflows/mex_tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests plotly streamlit

      - name: Run MEX unit tests
        run: |
          python -m unittest             tests.test_multiple_expansion             tests.test_jquants_mex_adapter

      - name: Compile MEX files
        run: |
          python -m py_compile             multiple_expansion.py             jquants_mex_adapter.py             scripts/build_mex_jquants.py             pages/14_Multiple_Expansion_Hunter.py
